<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2L-PROD | Beats & Production</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            text-align: center; 
            background-color: #0b0b0b; 
            color: #ffffff; 
            padding: 40px 20px;
            margin: 0;
        }
        .container {
            max-width: 650px;
            margin: auto;
            background: #161616;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            border: 1px solid #222;
        }
        h1 { 
            color: #ff5e00; 
            font-size: 2.2rem;
            margin-bottom: 5px;
        }
        .tagline {
            font-size: 1.1rem; 
            color: #cccccc;
            margin-bottom: 25px;
        }
        .genres {
            color: #ff5e00;
            font-weight: bold;
            margin-top: 10px;
            margin-bottom: 30px;
        }
        /* Style du lecteur */
        .player-section {
            background: #202020;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
            border: 1px solid #333;
        }
        .player-title {
            font-size: 1.2rem;
            margin-bottom: 15px;
            color: #ffffff;
            font-weight: bold;
        }
        .video-container {
            position: relative;
            padding-bottom: 56.25%; /* Ratio 16:9 */
            height: 0;
            overflow: hidden;
            border-radius: 6px;
        }
        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }
        /* Bouton WhatsApp */
        .btn {
            display: inline-block;
            background: #ff5e00;
            color: white;
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 30px;
            font-weight: bold;
            margin-top: 15px;
            transition: 0.3s;
        }
        .btn:hover {
            background: #e05200;
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>2L-PROD</h1>
        <p class="tagline">Production musicale • Mixage • Mastering</p>
        <p class="genres">Beats Drill • Afrobeat • Trap • Rumba</p>

        <!-- SECTION LECTEUR AUDIO / VIDEO -->
        <div class="player-section">
            <div class="player-title">🎧 Écouter ma dernière prod</div>
            <div class="video-container">
                <!-- Ta vidéo Video Games intégrée proprement -->
                <iframe src="https://www.youtube.com/embed/iy49BpDNVLc" allowfullscreen></iframe>
            </div>
        </div>

        <p>Prêt à collaborer sur ton prochain projet ?</p>
        <a href="https://wa.me/243844633415" class="btn" target="_blank">Me contacter sur WhatsApp</a>
    </div>
</body>
</html>
